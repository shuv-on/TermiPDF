name: termipdf
base: core22
version: "0.1.0"
summary: Modern PDF editor with an embedded terminal
description: |
  TermiPDF is a PyQt6 desktop PDF editor with a built-in terminal
  for batch operations.

  Features
  ────────
  • View PDFs (single-page or continuous-scroll), zoom, fit-to-window,
    outline (TOC) sidebar, thumbnail rail.
  • Annotate with freehand ink, multi-colour highlights, sticky notes,
    shapes (rect, ellipse, arrow), and Unicode text insertion
    (including Bangla).
  • Edit pages: delete, rotate, swap, split, merge, reorder, extract,
    and generate new PDFs from current pages.
  • Tools: QR-share popups, page-level image→PDF conversion,
    full-text search with auto-highlight, undo/redo, save.
  • Themes: dark (Dracula/Nord) and light (Edge-like), auto-detected
    from your OS preference, persisted across sessions.
  • Embedded terminal docks at the bottom of the
    window and exposes every feature as a typed command — type
    `help` to list them all.

  See the project README for the full command reference and keyboard
    shortcuts.

grade: stable
confinement: strict
contact: shuv-on@users.noreply.github.com
issues: https://github.com/shuv-on/TermiPDF/issues
source-code: https://github.com/shuv-on/TermiPDF
website: https://github.com/shuv-on/TermiPDF

icon: snap/gui/termipdf.png

apps:
  termipdf:
    command: usr/bin/termipdf-wrapper
    extensions: [gnome]                # Adwaita theme + GTK file dialogs
    common-id: termipdf.desktop
    desktop: usr/share/applications/termipdf.desktop
    plugs:
      - home                            # read/write PDFs in $HOME
      - desktop                         # .desktop file + icon
      - desktop-legacy                  # X11 fallback for older toolkits
      - x11                             # X11 display
      - wayland                         # Wayland display
      - opengl                          # Qt6 needs OpenGL
      - removable-media                 # PDFs on USB sticks

parts:
  # ------------------------------------------------------------------
  # Stage the project's `src/` tree into the snap prime tree so that
  # `python3 -m src.main` works at runtime. We use the `nil` plugin
  # because TermiPDF is not a pip-installable Python package (no
  # pyproject.toml / setup.py — it's a `src/` layout run directly).
  # ------------------------------------------------------------------
  termipdf:
    plugin: nil
    source: .
    override-build: |
      set -eux

      # Drop the source tree into dist-packages so the launcher can put
      # it on PYTHONPATH. The `src/shared/utils/path_solver.py` file
      # uses `Path(__file__).resolve().parents[3]` to find the project
      # root and locate the QSS files — preserving this layout keeps
      # dark/light theming working under the snap.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib/python3/dist-packages"
      cp -r src "$CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/src"

      # Install the launcher shell script (readable form kept in
      # snap/local/launcher.sh so reviewers can see exactly what the
      # wrapper does).
      install -D -m 0755 snap/local/launcher.sh \
        "$CRAFT_PART_INSTALL/usr/bin/termipdf-wrapper"

      # Install the XDG desktop entry.
      install -D -m 0644 snap/gui/termipdf.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/termipdf.desktop"

      # Install the app icon. Snapcraft will pick this up via the
      # `desktop:` field above.
      install -D -m 0644 snap/gui/termipdf.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/termipdf.png"

      # Provide a VERSION marker so the launcher can print the running
      # build on startup (helpful when users report bugs).
      mkdir -p "$CRAFT_PART_INSTALL/snap"
      cp snap/local/VERSION "$CRAFT_PART_INSTALL/snap/VERSION"
    override-prime: |
      set -eux
      craftctl default
      # Make sure our launcher + desktop entry + icon made it through.
      test -x "$CRAFT_PRIME/usr/bin/termipdf-wrapper"
      test -f "$CRAFT_PRIME/usr/share/applications/termipdf.desktop"

  # ------------------------------------------------------------------
  # Pull in Python + the four runtime deps (PyQt6, PyMuPDF, qrcode,
  # Pillow) plus the system libs Qt6 needs to talk to X11/Wayland,
  # render fonts, talk to the GPU, etc.
  # ------------------------------------------------------------------
  python-deps:
    plugin: python
    source: .
    python-packages:
      - PyQt6>=6.5.0
      - PyMuPDF>=1.23.0
      - qrcode>=7.4.0
      - Pillow>=10.0.0
    build-packages:
      - gcc
      - libffi-dev
      - libssl-dev
    stage-packages:
      # Qt6 platform deps
      - libxcb-cursor0
      - libxkbcommon0
      - libfontconfig1
      - libfreetype6
      - libdbus-1-3
      - libgl1
      - libegl1
      - libxcb-shape0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-image0
      - libxcb-keysyms1
      - libxkbcommon-x11-0
      - libsm6
      - libice6
      - libxrandr2
      - libxinerama1
      - libxi6
      - libxext6
      - libcups2
      - libpango-1.0-0
      - libcairo2
      # Misc
      - libsqlite3-0
      - zlib1g
